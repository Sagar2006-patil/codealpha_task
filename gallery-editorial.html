<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frame & Light — Photography Gallery</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sand: #F2EDE4; --ink: #1C1C1A; --rust: #B85C38;
    --stone: #8A8478; --cream: #FAF7F2; --border: #DDD8CE;
  }
  body { background: var(--cream); color: var(--ink); font-family: 'Inter', sans-serif; font-weight: 300; line-height: 1.6; }

  header {
    background: var(--ink); padding: 0 2rem; display: flex;
    align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; height: 60px;
  }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--cream); letter-spacing: 0.05em; }
  .logo span { color: var(--rust); font-style: italic; }
  nav { display: flex; gap: 2rem; }
  nav a { color: var(--stone); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; transition: color 0.2s; }
  nav a:hover { color: var(--cream); }

  .hero { padding: 4rem 2rem 2rem; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.5rem; }
  .hero-eyebrow { font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rust); }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 5vw, 3.6rem); font-weight: 400; line-height: 1.15; }
  .hero h1 em { font-style: italic; color: var(--stone); }
  .hero-sub { font-size: 0.88rem; color: var(--stone); max-width: 460px; margin-top: 0.25rem; }

  .filter-bar {
    max-width: 900px; margin: 2rem auto 0; padding: 0 2rem 1.2rem;
    display: flex; gap: 0.5rem; flex-wrap: wrap; border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    background: none; border: 1px solid var(--border); color: var(--stone);
    font-family: 'Inter', sans-serif; font-size: 0.78rem; letter-spacing: 0.08em;
    padding: 0.4rem 1rem; cursor: pointer; transition: all 0.2s; border-radius: 2px;
  }
  .filter-btn:hover { border-color: var(--ink); color: var(--ink); }
  .filter-btn.active { background: var(--ink); color: var(--cream); border-color: var(--ink); }

  .gallery-wrap { max-width: 900px; margin: 2.5rem auto; padding: 0 2rem; }
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .gallery-item {
    position: relative; overflow: hidden; background: var(--sand);
    cursor: pointer; border-radius: 2px;
  }
  .img-placeholder { width: 100%; padding-top: 100%; position: relative; overflow: hidden; }
  .img-bg {
    position: absolute; inset: 0;
    transition: transform 0.45s ease;
  }
  .img-bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item:hover .img-bg { transform: scale(1.05); }

  .item-overlay {
    position: absolute; inset: 0;
    background: rgba(28,28,26,0);
    display: flex; align-items: flex-end; padding: 1rem;
    transition: background 0.3s ease; pointer-events: none;
  }
  .gallery-item:hover .item-overlay { background: rgba(28,28,26,0.5); }
  .item-meta { opacity: 0; transform: translateY(6px); transition: all 0.3s ease; }
  .gallery-item:hover .item-meta { opacity: 1; transform: translateY(0); }
  .item-title { font-family: 'Playfair Display', serif; color: #fff; font-size: 0.9rem; font-style: italic; }
  .item-cat { font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.65); }

  .nav-arrows {
    max-width: 900px; margin: 0 auto 4rem; padding: 1.5rem 2rem 0;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border);
  }
  .arrow-btn {
    background: none; border: 1px solid var(--border);
    font-family: 'Inter', sans-serif; font-size: 0.78rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink); padding: 0.6rem 1.4rem;
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 0.5rem; border-radius: 2px;
  }
  .arrow-btn:hover:not(:disabled) { background: var(--ink); color: var(--cream); }
  .arrow-btn:disabled { opacity: 0.35; cursor: default; }
  .page-indicator { font-family: 'Playfair Display', serif; font-size: 0.9rem; color: var(--stone); }
  .page-indicator span { color: var(--ink); font-size: 1.1rem; }

  /* LIGHTBOX */
  .lightbox {
    display: none; position: fixed; inset: 0;
    background: rgba(28,28,26,0.95); z-index: 1000;
    align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
  }
  .lightbox.open { display: flex; }
  .lightbox-content {
    width: min(700px, 90vw); aspect-ratio: 4/3;
    border-radius: 2px; overflow: hidden; position: relative;
  }
  .lightbox-content img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-title { font-family: 'Playfair Display', serif; color: #fff; font-size: 1rem; font-style: italic; text-align: center; }
  .lb-controls { display: flex; gap: 1rem; align-items: center; }
  .lb-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 1.4rem; width: 44px; height: 44px;
    border-radius: 50%; cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-btn:hover { background: rgba(255,255,255,0.2); }
  .lb-close {
    position: absolute; top: 1rem; right: 1rem;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; font-size: 1rem; width: 36px; height: 36px;
    border-radius: 50%; cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-close:hover { background: rgba(255,255,255,0.25); }
  .lb-counter { color: rgba(255,255,255,0.45); font-size: 0.78rem; letter-spacing: 0.12em; }

  /* loading shimmer */
  .img-bg::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg,#e8e0d4 25%,#f0e8e0 50%,#e8e0d4 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    z-index: 0;
  }
  .img-bg img { position: relative; z-index: 1; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  @media (max-width: 640px) {
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    nav { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Frame <span>&</span> Light</div>
  <nav>
    <a href="#">Portfolio</a>
    <a href="#">Journal</a>
    <a href="#">About</a>
  </nav>
</header>

<div class="hero">
  <div class="hero-eyebrow">Selected Works — 2024</div>
  <h1>Images that hold<br><em>a moment still</em></h1>
  <p class="hero-sub">A curated collection across landscapes, architecture, and everyday life.</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="landscape">Landscape</button>
  <button class="filter-btn" data-filter="architecture">Architecture</button>
  <button class="filter-btn" data-filter="portrait">Portrait</button>
  <button class="filter-btn" data-filter="still-life">Still Life</button>
</div>

<div class="gallery-wrap">
  <div class="gallery-grid" id="grid"></div>
</div>

<div class="nav-arrows">
  <button class="arrow-btn" id="prevPage">← Previous</button>
  <div class="page-indicator"><span id="currentPage">1</span> / <span id="totalPages">3</span></div>
  <button class="arrow-btn" id="nextPage">Next →</button>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <div class="lightbox-content">
    <img id="lbImg" src="" alt="">
  </div>
  <div class="lb-title" id="lbTitle"></div>
  <div class="lb-controls">
    <button class="lb-btn" id="lbPrev">‹</button>
    <div class="lb-counter" id="lbCounter">1 / 9</div>
    <button class="lb-btn" id="lbNext">›</button>
  </div>
</div>

<script>
// All 27 photos — 3 pages of 9
const ALL_PHOTOS = [
  // PAGE 1
  { cat:'landscape',    title:'Morning Mist, Valley Road',     url:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80' },
  { cat:'architecture', title:'The Old Library Staircase',     url:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80' },
  { cat:'portrait',     title:'Sunday Afternoon',              url:'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600&q=80' },
  { cat:'still-life',   title:'Ceramic & Shadow',              url:'https://images.unsplash.com/photo-1565193566173-7a0ee3dbe261?w=600&q=80' },
  { cat:'landscape',    title:'Coastal Horizon at Dusk',       url:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80' },
  { cat:'architecture', title:'Brutalist Corner, East Block',  url:'https://images.unsplash.com/photo-1486325212027-8081e485255e?w=600&q=80' },
  { cat:'portrait',     title:'The Market Vendor',             url:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&q=80' },
  { cat:'still-life',   title:'Books at Golden Hour',          url:'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=600&q=80' },
  { cat:'landscape',    title:'Pine Ridge, November',          url:'https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&q=80' },
  // PAGE 2
  { cat:'landscape',    title:'Snowy Mountain Pass',           url:'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600&q=80' },
  { cat:'architecture', title:'Arched Bridge at Noon',         url:'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=600&q=80' },
  { cat:'portrait',     title:'Quiet Read',                    url:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&q=80' },
  { cat:'still-life',   title:'Spilled Flowers',               url:'https://images.unsplash.com/photo-1490750967868-88df5691cc9c?w=600&q=80' },
  { cat:'landscape',    title:'Golden Wheat Field',            url:'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&q=80' },
  { cat:'architecture', title:'Glass and Steel Tower',         url:'https://images.unsplash.com/photo-1515263487990-61b07816b324?w=600&q=80' },
  { cat:'portrait',     title:'Evening Light Portrait',        url:'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&q=80' },
  { cat:'still-life',   title:'Coffee & Morning Paper',        url:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&q=80' },
  { cat:'landscape',    title:'Desert Dunes at Sunset',        url:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=600&q=80' },
  // PAGE 3
  { cat:'landscape',    title:'Autumn Lakeside',               url:'https://images.unsplash.com/photo-1507041957456-9c397ce39c97?w=600&q=80' },
  { cat:'architecture', title:'Stone Cathedral Facade',        url:'https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=600&q=80' },
  { cat:'portrait',     title:'Street Corner, City Life',      url:'https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=600&q=80' },
  { cat:'still-life',   title:'Clay Pots & Herbs',             url:'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=600&q=80' },
  { cat:'landscape',    title:'Fog Over Rolling Hills',        url:'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=600&q=80' },
  { cat:'architecture', title:'Old Town Cobblestones',         url:'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=600&q=80' },
  { cat:'portrait',     title:'The Painter',                   url:'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=600&q=80' },
  { cat:'still-life',   title:'Candles at Dusk',               url:'https://images.unsplash.com/photo-1519710164239-da123dc03ef4?w=600&q=80' },
  { cat:'landscape',    title:'River Valley, Early Spring',    url:'https://images.unsplash.com/photo-1501854140801-50d01698950b?w=600&q=80' },
];

const PER_PAGE = 9;
let currentPage = 1;
let activeFilter = 'all';
let currentLbIdx = 0;
let filteredPhotos = [...ALL_PHOTOS];

const grid = document.getElementById('grid');
const lightbox = document.getElementById('lightbox');

function getFiltered() {
  return activeFilter === 'all' ? ALL_PHOTOS : ALL_PHOTOS.filter(p => p.cat === activeFilter);
}

function totalPages() {
  return Math.ceil(getFiltered().length / PER_PAGE);
}

function renderGrid() {
  filteredPhotos = getFiltered();
  const tp = Math.ceil(filteredPhotos.length / PER_PAGE);
  if (currentPage > tp) currentPage = Math.max(1, tp);

  document.getElementById('currentPage').textContent = currentPage;
  document.getElementById('totalPages').textContent = tp;
  document.getElementById('prevPage').disabled = currentPage === 1;
  document.getElementById('nextPage').disabled = currentPage === tp || tp === 0;

  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = filteredPhotos.slice(start, start + PER_PAGE);

  grid.innerHTML = '';
  pageItems.forEach((photo, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.innerHTML = `
      <div class="img-placeholder">
        <div class="img-bg">
          <img src="${photo.url}" alt="${photo.title}" loading="lazy">
        </div>
      </div>
      <div class="item-overlay">
        <div class="item-meta">
          <div class="item-title">${photo.title}</div>
          <div class="item-cat">${photo.cat}</div>
        </div>
      </div>`;
    div.addEventListener('click', () => { currentLbIdx = start + i; openLightbox(); });
    grid.appendChild(div);
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openLightbox() {
  const photo = filteredPhotos[currentLbIdx];
  document.getElementById('lbImg').src = photo.url;
  document.getElementById('lbTitle').textContent = photo.title;
  document.getElementById('lbCounter').textContent = (currentLbIdx + 1) + ' / ' + filteredPhotos.length;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}

document.getElementById('lbClose').addEventListener('click', () => { lightbox.classList.remove('open'); document.body.style.overflow = ''; });
lightbox.addEventListener('click', e => { if (e.target === lightbox) { lightbox.classList.remove('open'); document.body.style.overflow = ''; }});
document.getElementById('lbPrev').addEventListener('click', () => { currentLbIdx = (currentLbIdx - 1 + filteredPhotos.length) % filteredPhotos.length; openLightbox(); });
document.getElementById('lbNext').addEventListener('click', () => { currentLbIdx = (currentLbIdx + 1) % filteredPhotos.length; openLightbox(); });
document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'ArrowLeft') { currentLbIdx = (currentLbIdx - 1 + filteredPhotos.length) % filteredPhotos.length; openLightbox(); }
  if (e.key === 'ArrowRight') { currentLbIdx = (currentLbIdx + 1) % filteredPhotos.length; openLightbox(); }
  if (e.key === 'Escape') { lightbox.classList.remove('open'); document.body.style.overflow = ''; }
});

document.getElementById('prevPage').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderGrid(); }});
document.getElementById('nextPage').addEventListener('click', () => { if (currentPage < totalPages()) { currentPage++; renderGrid(); }});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    currentPage = 1;
    renderGrid();
  });
});

renderGrid();
</script>
</body>
</html>
