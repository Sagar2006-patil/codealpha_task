<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CALC‑7000 — Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --shop-1:#1c1d20;
    --shop-2:#0f1011;
    --panel-1:#3d4046;
    --panel-2:#26282c;
    --panel-edge:#15161a;
    --rivet:#0f1012;
    --rivet-shine:#5a5e64;
    --display-housing:#0e0908;
    --led:#ff4a3a;
    --led-dim:#5c2018;
    --led-glow:rgba(255,74,58,0.55);
    --key-bg:#4b4f56;
    --key-bg-light:#5d626a;
    --key-bg-press:#3a3d43;
    --key-text:#ece9e2;
    --accent-yellow:#f2b705;
    --accent-yellow-deep:#c28f03;
    --hazard-dark:#1a1a1a;
    --shadow-deep:rgba(0,0,0,0.65);
  }

  *{box-sizing:border-box;}

  html,body{ margin:0; min-height:100%; font-family:'Oswald',sans-serif; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    background:
      radial-gradient(circle at 50% 0%, var(--shop-1), var(--shop-2) 75%);
  }

  .panel{
    width:100%;
    max-width:350px;
    background:linear-gradient(160deg, var(--panel-1) 0%, var(--panel-2) 100%);
    border-radius:10px;
    padding:24px 20px 22px;
    border:1px solid var(--panel-edge);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.06) inset,
      0 30px 50px var(--shadow-deep),
      0 0 0 6px var(--panel-edge);
    position:relative;
  }

  .rivet{
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--rivet-shine), var(--rivet) 70%);
    box-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl{ top:10px; left:10px; }
  .rivet.tr{ top:10px; right:10px; }
  .rivet.bl{ bottom:10px; left:10px; }
  .rivet.br{ bottom:10px; right:10px; }

  .plate-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 4px 14px;
  }

  .plate-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.12em;
    font-size:14px;
    color:#d8d5cd;
    text-transform:uppercase;
  }

  .plate-title small{
    display:block;
    font-weight:400;
    letter-spacing:0.1em;
    font-size:9px;
    color:#8b8e93;
    margin-top:2px;
    text-transform:uppercase;
  }

  .status-led{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#5fd36a;
    box-shadow:0 0 7px 2px rgba(95,211,106,0.75);
    animation:blink 3s ease-in-out infinite;
  }

  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .hazard{
    height:6px;
    border-radius:3px;
    margin-bottom:14px;
    background:repeating-linear-gradient(
      135deg,
      var(--accent-yellow) 0px, var(--accent-yellow) 8px,
      var(--hazard-dark) 8px, var(--hazard-dark) 16px
    );
    opacity:0.85;
  }

  .display-housing{
    background:var(--display-housing);
    border-radius:6px;
    padding:16px 16px 12px;
    box-shadow:
      0 2px 6px rgba(0,0,0,0.7) inset,
      0 0 0 2px #050403,
      0 1px 0 rgba(255,255,255,0.04);
  }

  .readout-label{
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:0.18em;
    color:#7a4138;
    text-transform:uppercase;
    margin-bottom:2px;
  }

  .expression{
    min-height:16px;
    font-family:'Share Tech Mono', monospace;
    font-size:15px;
    letter-spacing:0.03em;
    color:var(--led-dim);
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .readout{
    font-family:'Share Tech Mono', monospace;
    font-size:48px;
    line-height:1.05;
    color:var(--led);
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-shadow:0 0 10px var(--led-glow), 0 0 2px var(--led-glow);
    transition:font-size 0.12s ease;
  }

  .readout.shrink{ font-size:34px; }

  .keys{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:9px;
    margin-top:16px;
  }

  .key{
    appearance:none;
    border:none;
    border-radius:6px;
    padding:15px 0;
    font-family:'Oswald',sans-serif;
    font-size:17px;
    font-weight:500;
    letter-spacing:0.02em;
    cursor:pointer;
    user-select:none;
    color:var(--key-text);
    background:linear-gradient(165deg, var(--key-bg-light), var(--key-bg));
    box-shadow:
      0 1px 0 rgba(255,255,255,0.12) inset,
      0 3px 0 rgba(0,0,0,0.5),
      0 5px 7px rgba(0,0,0,0.45);
    border-top:1px solid rgba(255,255,255,0.08);
    transition:transform 0.06s ease, box-shadow 0.06s ease, background 0.08s ease;
  }

  .key:active, .key.pressed{
    transform:translateY(2px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.4) inset,
      0 1px 0 rgba(0,0,0,0.5),
      0 2px 3px rgba(0,0,0,0.4);
    background:linear-gradient(165deg, var(--key-bg), var(--key-bg-press));
  }

  .key-func{ font-size:14px; color:#cfd0d2; }

  .key-op{
    background:linear-gradient(165deg, #5a5d63, #34363a);
    color:var(--accent-yellow);
    font-size:19px;
  }
  .key-op:active, .key-op.pressed{
    background:linear-gradient(165deg, #34363a, #25272b);
  }

  .key-clear{
    background:linear-gradient(165deg, #7a3a30, #5c2a22);
    color:#ffe2da;
    font-size:14px;
  }
  .key-clear:active, .key-clear.pressed{
    background:linear-gradient(165deg, #5c2a22, #441f19);
  }

  .key-equals{
    background:linear-gradient(165deg, var(--accent-yellow), var(--accent-yellow-deep));
    color:#241a00;
    font-size:19px;
    font-weight:600;
  }
  .key-equals:active, .key-equals.pressed{
    background:linear-gradient(165deg, var(--accent-yellow-deep), #9c7300);
  }

  .key-zero{ grid-column:span 2; }

  .key:focus-visible{
    outline:3px solid #5fb8ff;
    outline-offset:2px;
  }

  .hint{
    text-align:center;
    font-family:'Oswald',sans-serif;
    font-size:10px;
    letter-spacing:0.08em;
    color:#75787e;
    text-transform:uppercase;
    margin-top:16px;
  }

  @media (max-width:360px){
    .readout{ font-size:38px; }
    .key{ padding:13px 0; font-size:15px; }
  }
</style>
</head>
<body>

  <main class="panel" role="group" aria-label="CALC-7000 control panel calculator">
    <span class="rivet tl" aria-hidden="true"></span>
    <span class="rivet tr" aria-hidden="true"></span>
    <span class="rivet bl" aria-hidden="true"></span>
    <span class="rivet br" aria-hidden="true"></span>

    <div class="plate-row">
      <span class="plate-title">CALC‑7000<small>arithmetic unit</small></span>
      <span class="status-led" aria-hidden="true"></span>
    </div>

    <div class="hazard" aria-hidden="true"></div>

    <div class="display-housing">
      <div class="readout-label" aria-hidden="true">readout</div>
      <div class="expression" id="expression" aria-hidden="true"></div>
      <div class="readout" id="display" aria-live="polite">0</div>
    </div>

    <div class="keys">
      <button class="key key-clear" data-action="clear" aria-label="All clear">RESET</button>
      <button class="key key-func" data-action="backspace" aria-label="Backspace">⌫</button>
      <button class="key key-func" data-action="percent" aria-label="Percent">%</button>
      <button class="key key-op" data-op="÷" aria-label="Divide">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key key-op" data-op="×" aria-label="Multiply">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key key-op" data-op="−" aria-label="Subtract">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key key-op" data-op="+" aria-label="Add">+</button>

      <button class="key key-func" data-action="sign" aria-label="Toggle sign">±</button>
      <button class="key key-zero" data-num="0">0</button>
      <button class="key key-func" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
    </div>

    <p class="hint">keyboard wired — digits · + − * / · enter · esc</p>
  </main>

<script>
(function(){
  const display = document.getElementById('display');
  const expression = document.getElementById('expression');

  let buffer = '0';
  let firstOperand = null;
  let operatorSym = null;
  let resetBuffer = false;

  function formatNum(value){
    if(value === 'Error') return 'Error';
    const num = parseFloat(value);
    if(Number.isNaN(num)) return 'Error';
    let str = value.toString();
    const neg = str.startsWith('-');
    if(neg) str = str.slice(1);
    let [intPart, decPart] = str.split('.');
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + intPart + (decPart !== undefined ? '.' + decPart : '');
  }

  function compute(a, op, b){
    const x = parseFloat(a), y = parseFloat(b);
    if(Number.isNaN(x) || Number.isNaN(y)) return 'Error';
    let r;
    switch(op){
      case '+': r = x + y; break;
      case '−': r = x - y; break;
      case '×': r = x * y; break;
      case '÷': r = y === 0 ? NaN : x / y; break;
      default: r = y;
    }
    if(!Number.isFinite(r)) return 'Error';
    r = Math.round((r + Number.EPSILON) * 1e10) / 1e10;
    return String(r);
  }

  function refresh(){
    const shown = (operatorSym && !resetBuffer)
      ? compute(firstOperand, operatorSym, buffer)
      : (operatorSym ? firstOperand : buffer);

    display.textContent = formatNum(shown);
    display.classList.toggle('shrink', display.textContent.length > 9);

    if(operatorSym && !resetBuffer){
      expression.textContent = `${formatNum(firstOperand)} ${operatorSym} ${formatNum(buffer)}`;
    } else if(operatorSym){
      expression.textContent = `${formatNum(firstOperand)} ${operatorSym}`;
    } else {
      expression.textContent = '';
    }
  }

  function inputDigit(d){
    if(buffer === '0' || resetBuffer){
      buffer = d;
      resetBuffer = false;
    } else if(buffer.replace('-','').length < 12){
      buffer += d;
    }
    refresh();
  }

  function inputDecimal(){
    if(resetBuffer){
      buffer = '0.';
      resetBuffer = false;
    } else if(!buffer.includes('.')){
      buffer += '.';
    }
    refresh();
  }

  function chooseOperator(op){
    if(buffer === 'Error'){ clearAll(); }
    if(operatorSym && !resetBuffer){
      firstOperand = compute(firstOperand, operatorSym, buffer);
      buffer = firstOperand;
    } else {
      firstOperand = buffer;
    }
    operatorSym = op;
    resetBuffer = true;
    refresh();
  }

  function equals(){
    if(operatorSym === null || firstOperand === null) return;
    const result = compute(firstOperand, operatorSym, buffer);
    expression.textContent = `${formatNum(firstOperand)} ${operatorSym} ${formatNum(buffer)} =`;
    buffer = result;
    firstOperand = null;
    operatorSym = null;
    resetBuffer = true;
    display.textContent = formatNum(buffer);
    display.classList.toggle('shrink', display.textContent.length > 9);
  }

  function clearAll(){
    buffer = '0';
    firstOperand = null;
    operatorSym = null;
    resetBuffer = false;
    refresh();
  }

  function backspace(){
    if(buffer === 'Error'){ clearAll(); return; }
    resetBuffer = false;
    buffer = buffer.length > 1 ? buffer.slice(0, -1) : '0';
    refresh();
  }

  function toggleSign(){
    if(buffer === '0' || buffer === 'Error') return;
    buffer = buffer.startsWith('-') ? buffer.slice(1) : '-' + buffer;
    refresh();
  }

  function percent(){
    if(buffer === 'Error') return;
    buffer = String(parseFloat(buffer) / 100);
    refresh();
  }

  function flash(selector){
    const btn = document.querySelector(selector);
    if(!btn) return;
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 110);
  }

  document.querySelectorAll('.key').forEach(btn => {
    btn.addEventListener('click', () => {
      if(btn.dataset.num !== undefined) inputDigit(btn.dataset.num);
      else if(btn.dataset.op) chooseOperator(btn.dataset.op);
      else if(btn.dataset.action === 'clear') clearAll();
      else if(btn.dataset.action === 'backspace') backspace();
      else if(btn.dataset.action === 'percent') percent();
      else if(btn.dataset.action === 'sign') toggleSign();
      else if(btn.dataset.action === 'decimal') inputDecimal();
      else if(btn.dataset.action === 'equals') equals();
    });
  });

  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if(k >= '0' && k <= '9'){ inputDigit(k); flash(`[data-num="${k}"]`); }
    else if(k === '.'){ inputDecimal(); flash('[data-action="decimal"]'); }
    else if(k === '+'){ chooseOperator('+'); flash('[data-op="+"]'); }
    else if(k === '-'){ chooseOperator('−'); flash('[data-op="−"]'); }
    else if(k === '*'){ chooseOperator('×'); flash('[data-op="×"]'); }
    else if(k === '/'){ e.preventDefault(); chooseOperator('÷'); flash('[data-op="÷"]'); }
    else if(k === 'Enter' || k === '='){ e.preventDefault(); equals(); flash('[data-action="equals"]'); }
    else if(k === 'Backspace'){ backspace(); flash('[data-action="backspace"]'); }
    else if(k === 'Escape'){ clearAll(); flash('[data-action="clear"]'); }
    else if(k === '%'){ percent(); flash('[data-action="percent"]'); }
  });

  refresh();
})();
</script>
</body>
</html>
